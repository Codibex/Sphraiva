services:
  sphraiva-mcp-web-app:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "20000:8080"
      - "20001:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  sphraiva-open-webui:
    ports:
      - "20002:8080"
    volumes:
      - D:\Dev\data\sphraiva\open_webui_data:/app/backend/data

  sphraiva-n8n:
    ports:
      - "20004:5678"
    volumes:
      - D:\Dev\data\sphraiva\n8n_data:/home/node/.n8n

  sphraiva-mcp-host:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "20010:8080"
      - "20011:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  sphraiva-mcp-server:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "20015:8080"
      - "20016:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - ./data/dockerimages:/agent_data/dockerimages
      - D:/Dev/Sphraiva_Github_PAT:/agent_data/github
      - ./testdata:/data
      - /var/run/docker.sock:/var/run/docker.sock # For Docker-in-Docker support

  sphraiva-mcp-backgroundworker-filesystem:
    environment:
      - DOTNET_ENVIRONMENT=Development
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ./testdata:/data

  sphraiva-ollama-model:
    environment:
      - OLLAMA_MODEL=${LLM_MODEL}
      - OLLAMA_API_PORT=11434
      - OLLAMA_CONTEXT_LENGTH=20480
    ports:
      - "20005:11434"
    volumes:
      - D:\Dev\data\sphraiva\ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4.0' # Limit to 4 CPU cores
          memory: 32G # Limit to 32GB of RAM
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sphraiva-qdrant:
    ports:
      - "20006:6333"
    volumes:
      - D:\Dev\data\sphraiva\qrdant_data:/qrdant/data

  sphraiva-postgres:
    ports:
      - "20020:5432"
    volumes:
      - D:\Dev\data\sphraiva\postgres_data:/var/lib/postgresql/data
      - ./data/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh